const lessons = [
  { id: "geografi", title: "Yuk, Kenali Wilayah Indonesia", category: "Geografi", summary: "Kenali pulau, laut, dan letak Indonesia di peta dunia.", icon: "🗺️", level: "Mudah", goal: "Mengenal letak Indonesia, pulau-pulau besar, serta ciri wilayah daratan dan perairan.", paragraphs: ["Indonesia adalah negara kepulauan yang terletak di antara Benua Asia dan Australia, serta Samudra Hindia dan Pasifik. Wilayah Indonesia terdiri atas banyak pulau yang dihubungkan oleh laut.", "Lima pulau besar Indonesia adalah Sumatra, Jawa, Kalimantan, Sulawesi, dan Papua. Setiap wilayah memiliki bentang alam yang beragam, seperti pantai, dataran rendah, dataran tinggi, dan pegunungan.", "Peta membantu kita mengetahui letak suatu tempat. Saat membaca peta, perhatikan judul, arah mata angin, simbol, dan keterangannya."], fact: "Indonesia memiliki lebih dari 17.000 pulau. Pulau-pulau tersebut tersebar dari Sabang sampai Merauke.", example: "Pernahkah kamu melihat peta saat mencari kota tujuan liburan? Peta membantu kita memilih arah dan mengetahui jarak." },
  { id: "keragaman", title: "Indahnya Keragaman Indonesia", category: "Budaya", summary: "Kenali suku, bahasa, dan tradisi yang beragam.", icon: "🎭", level: "Mudah", goal: "Memahami keragaman suku, bahasa daerah, agama, dan kebiasaan masyarakat Indonesia.", paragraphs: ["Indonesia memiliki banyak suku dan bahasa daerah. Bahasa Indonesia menjadi bahasa persatuan yang membantu kita berkomunikasi dengan teman dari berbagai daerah.", "Masyarakat Indonesia juga memiliki agama, tradisi, dan kebiasaan yang beragam. Perbedaan ini adalah kekayaan yang patut dihormati.", "Kita dapat menjaga kerukunan dengan saling menghargai, tidak mengejek perbedaan, dan mau belajar tentang kebiasaan teman."], fact: "Bahasa Indonesia diikrarkan sebagai bahasa persatuan dalam Sumpah Pemuda pada 28 Oktober 1928.", example: "Saat teman merayakan hari besar keagamaannya, kita bisa memberi ucapan yang baik dan menghormatinya." },
  { id: "adat", title: "Rumah dan Pakaian Adat", category: "Budaya", summary: "Jelajahi bentuk rumah dan pakaian tradisional.", icon: "🏠", level: "Sedang", goal: "Mengenali contoh rumah adat dan pakaian tradisional dari beberapa daerah.", paragraphs: ["Rumah adat dan pakaian tradisional menunjukkan kreativitas masyarakat di berbagai daerah. Bentuknya berkembang sesuai lingkungan, bahan yang tersedia, dan kebutuhan masyarakat.", "Rumah Gadang berasal dari Sumatra Barat. Rumah ini memiliki atap khas yang melengkung. Honai adalah rumah tradisional masyarakat di wilayah pegunungan Papua.", "Pakaian tradisional dipakai dalam acara tertentu, misalnya upacara adat dan perayaan. Setiap daerah memiliki ragam pakaian yang unik."], fact: "Rumah tradisional panggung dibangun lebih tinggi dari tanah. Bentuk ini membantu menghadapi kondisi lingkungan tertentu.", example: "Di sekolah, kamu dapat melihat pakaian adat saat teman-teman mengikuti kegiatan peringatan hari nasional." },
  { id: "alam", title: "Alam Kaya, Yuk Kita Jaga", category: "Lingkungan", summary: "Belajar tentang sumber daya alam dan cara merawatnya.", icon: "🌱", level: "Sedang", goal: "Membedakan sumber daya alam dan memahami cara memanfaatkannya dengan bijak.", paragraphs: ["Sumber daya alam adalah segala sesuatu dari alam yang dapat dimanfaatkan manusia, seperti air, tanah, tumbuhan, hewan, dan bahan tambang.", "Ada sumber daya yang dapat pulih kembali, seperti tumbuhan jika ditanam lagi. Ada pula sumber daya yang jumlahnya terbatas, seperti minyak bumi. Karena itu, kita perlu menggunakannya secara bijak.", "Lingkungan yang sehat penting bagi manusia, hewan, dan tumbuhan. Menjaga kebersihan sungai dan menanam pohon adalah contoh tindakan baik."], fact: "Hutan membantu menjaga udara dan menjadi tempat hidup banyak tumbuhan serta satwa.", example: "Kamu dapat membawa botol minum sendiri dan membuang sampah pada tempatnya untuk mengurangi sampah plastik." },
  { id: "ekonomi", title: "Kegiatan Ekonomi di Sekitar Kita", category: "Ekonomi", summary: "Kenali kegiatan produksi, distribusi, dan konsumsi.", icon: "🧺", level: "Sedang", goal: "Menceritakan hubungan produksi, distribusi, dan konsumsi dengan contoh sederhana.", paragraphs: ["Kegiatan ekonomi dilakukan orang untuk memenuhi kebutuhan hidup. Kegiatan ini terdiri atas produksi, distribusi, dan konsumsi.", "Produksi adalah kegiatan membuat barang atau jasa. Distribusi adalah kegiatan menyalurkan barang dari pembuat kepada pembeli. Konsumsi adalah kegiatan menggunakan barang atau jasa.", "Petani menanam padi (produksi), pedagang mengirim beras ke pasar (distribusi), lalu keluarga membeli dan memasaknya (konsumsi)."], fact: "Satu barang bisa melibatkan banyak orang sebelum sampai kepada pembeli.", example: "Roti yang kamu makan dibuat oleh pembuat roti, diantar ke toko, lalu dibeli untuk sarapan." },
  { id: "pekerjaan", title: "Beragam Pekerjaan Masyarakat", category: "Sosial", summary: "Lihat bagaimana pekerjaan memenuhi kebutuhan bersama.", icon: "👩‍🌾", level: "Mudah", goal: "Menjelaskan contoh pekerjaan dan hubungan pekerjaan dengan kondisi lingkungan.", paragraphs: ["Masyarakat memiliki berbagai pekerjaan, seperti petani, nelayan, guru, perawat, pedagang, pengrajin, dan pengemudi.", "Jenis pekerjaan dapat dipengaruhi oleh lingkungan dan keterampilan. Masyarakat di daerah pantai, misalnya, dapat bekerja sebagai nelayan atau pembuat garam. Namun, setiap orang bebas memilih pekerjaan sesuai minat dan kemampuannya.", "Semua pekerjaan yang dilakukan dengan baik dan jujur memiliki manfaat bagi masyarakat."], fact: "Pekerjaan di sebuah daerah dapat berubah seiring perkembangan teknologi dan kebutuhan masyarakat.", example: "Guru membantu kita belajar, sedangkan petani membantu menyediakan bahan makanan." },
  { id: "sejarah", title: "Mengenal Perjuangan Bangsa", category: "Sejarah", summary: "Belajar tentang persatuan dan perjuangan kemerdekaan.", icon: "🇮🇩", level: "Sedang", goal: "Mengenal beberapa peristiwa penting dalam perjuangan bangsa Indonesia.", paragraphs: ["Bangsa Indonesia berjuang bersama untuk meraih kemerdekaan. Perjuangan dilakukan dengan berbagai cara oleh banyak tokoh dan masyarakat dari berbagai daerah.", "Pada 28 Oktober 1928, para pemuda mengikrarkan Sumpah Pemuda: satu tanah air, satu bangsa, dan satu bahasa, Indonesia. Persatuan membantu masyarakat menghadapi tantangan bersama.", "Indonesia memproklamasikan kemerdekaan pada 17 Agustus 1945. Kita dapat menghargai perjuangan dengan belajar, menjaga persatuan, dan mencintai tanah air."], fact: "Naskah Proklamasi dibacakan oleh Soekarno didampingi Mohammad Hatta di Jakarta.", example: "Bekerja sama dengan teman yang berbeda daerah adalah salah satu cara kecil merawat semangat persatuan." },
  { id: "gotongroyong", title: "Gotong Royong, Hati Senang", category: "Sosial", summary: "Temukan serunya kerja sama dalam kehidupan sehari-hari.", icon: "🤝", level: "Mudah", goal: "Menjelaskan manfaat kerja sama dan gotong royong di rumah maupun masyarakat.", paragraphs: ["Gotong royong adalah bekerja bersama untuk mencapai tujuan yang baik. Kegiatan ini dapat dilakukan di rumah, sekolah, maupun lingkungan sekitar.", "Dengan bekerja sama, pekerjaan terasa lebih ringan dan hubungan antarwarga menjadi lebih akrab. Setiap orang dapat membantu sesuai kemampuan.", "Kerja sama juga berarti mendengarkan pendapat, berbagi tugas dengan adil, dan menyelesaikan masalah bersama."], fact: "Membersihkan kelas bersama-sama adalah contoh gotong royong yang bisa dilakukan setiap hari.", example: "Saat kerja kelompok, bagilah tugas dan bantu teman jika ia mengalami kesulitan." },

function culturePage() {
  const category = cultureCategories.find((item) => item.id === state.cultureCategory);
  const categoryItems = category ? cultures.filter((item) => item.category === category.id) : [];
  const cards = categoryItems.map((item) => `<article class="culture-card"><div class="culture-image culture-art culture-art-${item.art}" role="img" aria-label="Ilustrasi ${item.name}">${cultureArtwork(item.art)}</div><div class="culture-info"><h3>${item.name}</h3><small>${item.type}</small><p>${item.description}</p></div></article>`).join("");
  const challengeItem = cultures[state.cultureQuestion];
  const challenge = state.cultureQuestion === null
    ? `<div class="culture-challenge-start"><span aria-hidden="true">🧠</span><p>Tebak nama ${category ? category.label : "budaya atau satwa"} berdasarkan ilustrasinya. Setiap jawaban benar untuk koleksi yang belum pernah ditebak mendapat 5 poin.</p><button class="btn" data-action="start-culture">Mulai Tebak →</button></div>`
    : `<div class="culture-challenge"><div class="culture-challenge-image culture-art culture-art-${challengeItem.art}" role="img" aria-label="Gambar ${challengeItem.name} untuk ditebak">${cultureArtwork(challengeItem.art)}</div><div class="culture-challenge-body"><strong>Apa nama ${category ? category.label : "budaya atau satwa"} ini?</strong><div class="culture-options">${state.cultureOptions.map((index) => `<button class="choice-chip" data-action="answer-culture" data-index="${index}" ${state.cultureAnswer !== null ? "disabled" : ""}>${cultures[index].name}</button>`).join("")}</div>
      ${state.cultureAnswer !== null ? `<p class="culture-answer ${state.cultureAnswer === state.cultureQuestion ? "correct" : "incorrect"}" role="status">${state.cultureAnswer === state.cultureQuestion ? `Tepat! Ini ${challengeItem.name} (${challengeItem.type}).${state.cultureSolved.includes(challengeItem.id) ? "" : " Kamu mendapat 5 poin!"}` : `Belum tepat. Jawabannya ${challengeItem.name}. ${challengeItem.description}`}</p><button class="btn btn-light" data-action="next-culture">Coba Gambar Lain →</button>` : ""}</div></div>`;
  const collection = category
    ? `<header class="collection-heading"><button class="text-link" data-action="culture-back">← Semua kategori</button><span class="eyebrow">${category.name} · ${categoryItems.length} contoh</span><h2>${category.name} dari berbagai daerah</h2><p class="subheading">${category.description} Koleksi ini menampilkan contoh dari beberapa daerah di Indonesia.</p></header><div class="culture-grid">${cards}</div>`
    : `<div class="culture-category-grid">${cultureCategories.map((item) => { const count = cultures.filter((culture) => culture.category === item.id).length; return `<button class="culture-category-card" data-action="culture-category" data-category="${item.id}"><span class="culture-category-image culture-art culture-art-${item.icon}" role="img" aria-label="Ilustrasi ${item.name}">${cultureArtwork(item.icon)}</span><span class="culture-category-copy"><strong>${item.name}</strong><small>${count} contoh dari berbagai daerah</small><span>${item.description}</span><b>Buka koleksi →</b></span></button>`; }).join("")}</div>`;
  return `<header class="page-header"><span class="eyebrow">Beragam, indah, milik bersama</span><h1>Jelajah Budaya dan Satwa</h1><p class="subheading">Pilih kategori untuk mengenal rumah adat, alat musik, tarian, kain, makanan, senjata tradisional, dan satwa khas dari berbagai daerah Indonesia.</p></header>
    <section class="panel culture-game"><div class="panel-title"><h3>🎯 Tantangan tebak budaya & satwa</h3><span class="level-tag">+5 poin untuk jawaban benar</span></div>${challenge}</section>${collection}`;
}
function quizPage() {
  if (state.route === "hasil-kuis") return resultPage();
  const i = state.quizIndex;
  const question = questions[i];
  const selected = state.quizAnswers[i];
  const answered = selected !== undefined;
  return `<header class="page-header"><span class="eyebrow">Pikirkan baik-baik, kamu pasti bisa!</span><h1>Kuis Penjelajah</h1><p class="subheading">Jawab 10 pertanyaan IPS. Setiap jawaban benar bernilai 10 poin.</p></header>
    <div class="quiz-wrap"><section class="quiz-card"><div class="quiz-top"><span>PERTANYAAN ${i + 1} DARI ${questions.length}</span><span>⭐ ${state.quizAnswers.filter((answer,index) => answer === questions[index].answer).length * 10} poin</span></div><div class="quiz-progress"><div style="width:${(i + 1) / questions.length * 100}%"></div></div>
      <span class="eyebrow">Pilih satu jawaban yang paling tepat</span><h2>${question.q}</h2>
      <div class="answers">${question.options.map((option,index) => {
        let status = "";
        if (answered && index === question.answer) status = "correct";
        else if (answered && index === selected) status = "wrong";
        return `<button class="answer-option ${status}" data-action="answer" data-index="${index}" ${answered ? "disabled" : ""}><span class="letter">${String.fromCharCode(65 + index)}</span>${option}</button>`;
      }).join("")}</div>
      ${answered ? `<div class="answer-feedback ${selected === question.answer ? "good" : "try-again"}">${selected === question.answer ? "🎉 Hebat, jawabanmu benar!" : "🌱 Belum tepat, tidak apa-apa!"} ${question.explain}</div>` : ""}
      <div class="quiz-footer"><small>${answered ? (selected === question.answer ? "10 poin ditambahkan ke hasil kuismu." : "Pelajari penjelasannya dan coba lagi nanti.") : "Pilih jawabanmu untuk melanjutkan."}</small><button class="btn btn-blue" data-action="next-question" ${answered ? "" : "disabled"}>${i === questions.length - 1 ? "Lihat Hasil →" : "Soal Berikutnya →"}</button></div>
    </section></div>`;
}
function resultPage() {
  const correct = state.quizAnswers.filter((answer,index) => answer === questions[index].answer).length;
  const points = correct * 10;
  const badge = correct >= 8 ? "🏅" : correct >= 5 ? "🌟" : "🌱";
  const message = correct >= 8 ? "Luar biasa! Kamu penjelajah yang hebat!" : correct >= 5 ? "Hebat! Terus belajar dan tambah pengetahuanmu!" : "Semangat! Setiap petualangan adalah kesempatan untuk belajar.";
  return `<header class="page-header" style="text-align:center"><span class="eyebrow">Petualangan kuis selesai</span><h1>Hore, kamu berhasil!</h1></header><section class="result-card"><div class="result-medal">${badge}</div><h2>${message}</h2><div class="score-big">${correct * 10}<span style="font-size:19px"> / 100</span></div><p class="subheading">Nilai akhir · ${correct} jawaban benar dari ${questions.length} soal</p><div class="result-stats"><span>✅ Benar: ${correct}</span><span>💭 Perlu belajar lagi: ${questions.length - correct}</span><span>⭐ Poin: ${points}</span></div><p class="subheading">${correct >= 8 ? "Lencana Bintang Kuis ditambahkan ke koleksimu!" : "Coba lagi untuk mendapatkan lebih banyak poin dan lencana."}</p><div class="result-actions"><button class="btn btn-light" data-action="retry-quiz">↻ Ulangi Kuis</button><button class="btn" data-action="home">⌂ Kembali ke Beranda</button></div></section>`;
}
function achievementsPage() {
  const badges = [
    { id: "budaya", title: "Penjelajah Budaya", icon: "🎭", desc: "Selesaikan materi keragaman atau tebak budaya dan satwa dengan benar.", earned: state.badges.includes("budaya") },
    { id: "geografi", title: "Ahli Geografi", icon: "🗺️", desc: "Selesaikan materi wilayah dan kondisi geografis.", earned: state.badges.includes("geografi") },
    { id: "lingkungan", title: "Sahabat Lingkungan", icon: "🌱", desc: "Selesaikan materi sumber daya alam dan lingkungan.", earned: state.badges.includes("lingkungan") },
    { id: "kuis", title: "Bintang Kuis", icon: "🏅", desc: "Jawab benar setidaknya 8 soal dalam satu kuis.", earned: state.badges.includes("kuis") },
    { id: "belajar", title: "Rajin Belajar", icon: "📚", desc: "Selesaikan 3 materi IPS.", earned: state.badges.includes("belajar") },
    { id: "petualang", title: "Penjelajah Nusantara", icon: "🧭", desc: "Selesaikan semua materi IPS.", earned: state.badges.includes("petualang") },
  ];
  return `<header class="page-header"><span class="eyebrow">Setiap langkah layak dirayakan</span><h1>Prestasi Penjelajah</h1><p class="subheading">Lihat semua hal hebat yang sudah kamu capai dalam perjalanan belajar.</p></header>
    <div class="stats-grid"><div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-copy"><small>Total poin terkumpul</small><strong>${state.points}</strong></div></div><div class="stat-card"><div class="stat-icon">🧭</div><div class="stat-copy"><small>Level penjelajah</small><strong>${levelName()}</strong></div></div><div class="stat-card"><div class="stat-icon">🏆</div><div class="stat-copy"><small>Lencana diraih</small><strong>${badges.filter((item) => item.earned).length} / ${badges.length}</strong></div></div></div>
    <div class="section-heading"><h2>Koleksi lencana</h2></div><div class="badge-grid">${badges.map((badge) => `<article class="badge-card ${badge.earned ? "" : "locked"}"><div class="badge-emoji">${badge.icon}</div><h3>${badge.title}</h3><p>${badge.earned ? "Sudah kamu raih! Hebat!" : badge.desc}</p></article>`).join("")}</div>
    <div class="section-heading"><h2>Progres belajarmu</h2></div><div class="achievement-grid"><section class="achievement-panel"><h3>📈 Perjalanan materi</h3><div class="progress-track"><div class="progress-fill" style="width:${progress()}%"></div></div><div class="progress-info"><span>${state.completed.length} dari ${lessons.length} materi selesai</span><strong>${progress()}%</strong></div><button class="btn" data-route="materi">Lanjutkan belajar →</button></section><section class="achievement-panel"><h3>✅ Materi yang sudah selesai</h3><div class="completion-list">${state.completed.length ? state.completed.map((id) => { const item = lessons.find((lesson) => lesson.id === id); return item ? `<div class="completion-item"><span>✓</span><span>${item.icon}</span><strong>${item.title}</strong></div>` : ""; }).join("") : `<p class="subheading">Belum ada materi selesai. Mulai petualangan pertamamu!</p>`}</div></section></div>`;
}
function profilePage() {
  return `<header class="page-header"><span class="eyebrow">Ruang belajarmu</span><h1>Profil & Pengaturan</h1><p class="subheading">Atur profil dan tampilan belajar sesuai kebutuhanmu.</p></header>
    <section class="profile-card"><div class="profile-avatar">🧑🏻‍🎓</div><div><span class="eyebrow">PENJELAJAH NUSANTARA</span><h2 style="margin:5px 0">${escapeHtml(state.name)}</h2><p class="subheading" style="margin:0">Kelas ${escapeHtml(state.grade)} · ${levelName()}</p></div></section>
    <form class="profile-form" id="profile-form"><label class="form-field">Nama panggilan<input name="name" maxlength="30" required value="${escapeHtml(state.name)}" autocomplete="nickname" /></label>
      <label class="form-field">Kelas<select name="grade">${[4,5,6].map((grade) => `<option value="${grade}" ${String(grade) === String(state.grade) ? "selected" : ""}>Kelas ${grade}</option>`).join("")}</select></label>
      <label class="toggle-row"><span>🔊 Suara dan efek suara</span><input name="sound" type="checkbox" ${state.sound ? "checked" : ""} aria-label="Aktifkan suara" /></label>
      <label class="toggle-row"><span>🔎 Ukuran teks lebih besar</span><input name="largeText" type="checkbox" ${state.largeText ? "checked" : ""} aria-label="Gunakan ukuran teks besar" /></label>
      <button class="btn" type="submit">Simpan pengaturan ✓</button>${state.loggedIn ? `<button class="btn btn-light" type="button" data-action="logout">Keluar dari profil</button>` : `<button class="btn btn-light" type="button" data-route="login">Masuk ke profil</button>`}<button class="btn btn-light" type="button" data-action="home">Kembali ke Beranda</button>
    </form>`;
}
function loginPage() {
  return `<header class="page-header"><span class="eyebrow">Simpan perjalanan belajarmu</span><h1>Masuk Penjelajah</h1><p class="subheading">Gunakan nama panggilan agar profil belajarmu mudah dikenali.</p></header>
    <section class="login-panel"><div class="login-illustration" aria-hidden="true">🧭</div><form class="profile-form login-form" id="login-form"><label class="form-field">Nama panggilan<input name="name" maxlength="30" required value="${escapeHtml(state.name === defaults.name ? "" : state.name)}" placeholder="Contoh: Bintang" autocomplete="nickname" /></label><label class="form-field">Kelas<select name="grade">${[4,5,6].map((grade) => `<option value="${grade}" ${String(grade) === String(state.grade) ? "selected" : ""}>Kelas ${grade}</option>`).join("")}</select></label><button class="btn" type="submit">Masuk dan mulai belajar →</button><button class="btn btn-light" type="button" data-action="home">Nanti saja</button></form><p class="login-note">🔒 Ini profil lokal untuk perangkat ini, bukan akun online. Tidak memakai kata sandi atau mengirim data ke server. Jangan masukkan nama lengkap atau informasi pribadi.</p></section>`;
}
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
}
function render() {
  const app = document.getElementById("app");
  const names = { beranda: "Beranda", materi: "Materi IPS", peta: "Peta Indonesia", budaya: "Jelajah Budaya", kuis: "Kuis Penjelajah", "hasil-kuis": "Hasil Kuis", prestasi: "Prestasi", profil: "Profil & pengaturan", login: "Masuk", detail: "Detail Materi" };
  document.getElementById("breadcrumbs").innerHTML = `Ruang belajar <span>/</span> ${names[state.route] || "Beranda"}`;
  document.getElementById("top-points").textContent = state.points;
  const authButton = document.getElementById("auth-button");
  authButton.dataset.route = state.loggedIn ? "profil" : "login";
  authButton.textContent = state.loggedIn ? `👤 ${state.name}` : "↪ Masuk";
  authButton.setAttribute("aria-label", state.loggedIn ? `Profil ${state.name}` : "Masuk ke profil lokal");
  document.querySelectorAll(".side-nav [data-route], .profile-link, .mobile-nav [data-route]").forEach((button) => button.classList.toggle("active", button.dataset.route === state.route || (state.route === "detail" && button.dataset.route === "materi") || (state.route === "hasil-kuis" && button.dataset.route === "kuis")));
  const pages = {
    beranda: homePage, materi: materialsPage, peta: mapPage, budaya: culturePage,
    kuis: quizPage, "hasil-kuis": resultPage, prestasi: achievementsPage,
    profil: profilePage, login: loginPage, detail: lessonDetail,
  };
  app.innerHTML = (pages[state.route] || homePage)();
  document.body.classList.toggle("large-text", state.largeText);
  if (state.route === "kuis" && state.quizIndex >= questions.length) state.route = "hasil-kuis";
}
function completeLesson(id) {
  if (!state.completed.includes(id)) {
    state.completed.push(id);
    state.points += 20;
    if (id === "geografi") awardBadge("geografi");
    if (id === "keragaman" || id === "adat") awardBadge("budaya");
    if (id === "alam") awardBadge("lingkungan");
    if (state.completed.length >= 3) awardBadge("belajar");
    if (state.completed.length === lessons.length) awardBadge("petualang");
    persist();
    toast("Materi selesai! 20 poin ditambahkan. Hebat! ⭐");
  } else {
    toast("Materi ini sudah masuk daftar selesaimu. Tetap semangat! 🌟");
  }
  render();
}
function startQuiz() {
  state.quizIndex = 0;
  state.quizAnswers = [];
  navigate("kuis");
}
function handleClick(event) {
  const target = event.target.closest("button, [data-region]");
  if (!target) return;
  if (target.dataset.route) { navigate(target.dataset.route); return; }
  if (target.dataset.region) {
    state.region = target.dataset.region;
    render();
    return;
  }
  const action = target.dataset.action;
  if (!action) return;
  if (action === "home") navigate("beranda");
  if (action === "start-learning") navigate("materi");
  if (action === "open-lesson") { state.lesson = target.dataset.id; navigate("detail"); }
  if (action === "culture-category") {
    state.cultureCategory = target.dataset.category;
    state.cultureQuestion = null;
    state.cultureAnswer = null;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (action === "culture-back") {
    state.cultureCategory = null;
    state.cultureQuestion = null;
    state.cultureAnswer = null;
    render();
    return;
  }
  if (action === "logout") {
    state.loggedIn = false;
    persist();
    navigate("beranda");
    toast("Kamu sudah keluar dari profil di perangkat ini.");
    return;
  }
  if (action === "complete-lesson") completeLesson(target.dataset.id);
  if (action === "lesson-prev" || action === "lesson-next") { state.lesson = lessons[Number(target.dataset.index)].id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  if (action === "start-quiz") startQuiz();
  if (action === "learn-region") {
    const id = selectedRegion().id === "bali" ? "adat" : selectedRegion().id === "maluku" ? "keragaman" : "geografi";
    state.lesson = id; navigate("detail");
  }
  if (action === "answer") {
    if (state.quizAnswers[state.quizIndex] !== undefined) return;
    state.quizAnswers[state.quizIndex] = Number(target.dataset.index);
    render();
  }
  if (action === "next-question") {
    if (state.quizAnswers[state.quizIndex] === undefined) return;
    if (state.quizIndex < questions.length - 1) { state.quizIndex += 1; render(); }
    else {
      const correct = state.quizAnswers.filter((answer,index) => answer === questions[index].answer).length;
      const earned = correct * 10;
      state.points += earned;
      state.quizBest = Math.max(state.quizBest, correct);
      if (correct >= 8) awardBadge("kuis");
      persist();
      navigate("hasil-kuis");
    }
  }
  if (action === "retry-quiz") startQuiz();
  if (action === "start-culture" || action === "next-culture") {
    const available = cultures.map((_, index) => index).filter((index) => !state.cultureCategory || cultures[index].category === state.cultureCategory);
    state.cultureQuestion = available[Math.floor(Math.random() * available.length)];
    const wrongOptions = available.filter((index) => index !== state.cultureQuestion);
    for (let index = wrongOptions.length - 1; index > 0; index--) {
      const randomIndex = Math.floor(Math.random() * (index + 1));
      [wrongOptions[index], wrongOptions[randomIndex]] = [wrongOptions[randomIndex], wrongOptions[index]];
    }
    state.cultureOptions = [state.cultureQuestion, ...wrongOptions.slice(0, 3)];
    for (let index = state.cultureOptions.length - 1; index > 0; index--) {
      const randomIndex = Math.floor(Math.random() * (index + 1));
      [state.cultureOptions[index], state.cultureOptions[randomIndex]] = [state.cultureOptions[randomIndex], state.cultureOptions[index]];
    }
    state.cultureAnswer = null;
    render();
    return;
  }
  if (action === "answer-culture") {
    if (state.cultureAnswer !== null) return;
    state.cultureAnswer = Number(target.dataset.index);
    const answeredItem = cultures[state.cultureQuestion];
    if (state.cultureAnswer === state.cultureQuestion && !state.cultureSolved.includes(answeredItem.id)) {
      state.cultureSolved.push(answeredItem.id);
      state.points += 5;
      awardBadge("budaya");
      persist();
    }
    render();
    return;
  }
}
document.addEventListener("keydown", (event) => {
  if ((event.key !== "Enter" && event.key !== " ") || !event.target.matches(".island-group")) return;
  event.preventDefault();
  state.region = event.target.dataset.region;
  render();
});
document.addEventListener("click", handleClick);
document.addEventListener("submit", (event) => {
  if (event.target.id === "login-form") {
    event.preventDefault();
    const form = new FormData(event.target);
    const name = String(form.get("name") || "").trim();
    if (!name) {
      toast("Tulis nama panggilan terlebih dahulu.");
      return;
    }
    state.name = name;
    state.grade = String(form.get("grade") || defaults.grade);
    state.loggedIn = true;
    persist();
    navigate("beranda");
    toast(`Selamat datang, ${state.name}! 🌟`);
    return;
  }
  if (event.target.id !== "profile-form") return;
  event.preventDefault();
  const form = new FormData(event.target);
  state.name = String(form.get("name") || "").trim() || defaults.name;
  state.grade = String(form.get("grade") || defaults.grade);
  state.sound = form.get("sound") === "on";
  state.largeText = form.get("largeText") === "on";
  persist();
  render();
  toast("Pengaturan berhasil disimpan. ✨");
});
persist();
render();
    </script>
  </body>
</html>
